name: codeowners
description: "Ensure every repository has a CODEOWNERS file"
params:
  default_owner:
    type: string
    required: true
    description: "Default code owner (e.g. @my-team)"
# GitHub honours CODEOWNERS in the repo root, .github/, or docs/. Treat any
# of them as compliant; create the root file with the default owner when none
# exist.
rules:
  - !ensure_file
    paths:
      - CODEOWNERS
      - .github/CODEOWNERS
      - docs/CODEOWNERS
    default_content: "* {{ default_owner }}\n"
