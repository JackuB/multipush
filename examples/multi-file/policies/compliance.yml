# Compliance policies — CODEOWNERS and README requirements

policies:
  - name: require-codeowners
    description: Every repository must have a CODEOWNERS file
    severity: error
    targets:
      repos: "${GITHUB_ORG}/*"
    rules:
      # CODEOWNERS is valid in the repo root, .github/, or docs/ — accept any.
      # When none exist, create the root file owned by the platform team.
      - !ensure_file
        paths:
          - CODEOWNERS
          - .github/CODEOWNERS
          - docs/CODEOWNERS
        default_content: "* @${GITHUB_ORG}/platform-team\n"

  - name: require-readme
    description: Every repository must have a README
    severity: warning
    targets:
      repos: "${GITHUB_ORG}/*"
    rules:
      - !ensure_file
        path: README.md
